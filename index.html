<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIOS DIAN • Katalog Digital & Pemesanan</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B1120;
      --bg-card: #131C31;
      --bg-card-hover: #19243E;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --accent-gold: #F59E0B;
      --accent-emerald: #10B981;
      --accent-blue: #38BDF8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-primary); padding-bottom: 105px; line-height: 1.5; }
    
    /* Header Premium */
    .hero-header {
      background: radial-gradient(circle at top right, #1E3A8A 0%, #0F172A 55%, #0B1120 100%);
      padding: 28px 18px 24px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: center;
      position: relative;
    }
    .badge-toko {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(16, 185, 129, 0.14); color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 10px;
    }
    .dot-live { width: 7px; height: 7px; background: #10B981; border-radius: 50%; box-shadow: 0 0 8px #10B981; }
    .hero-header h1 {
      font-size: 26px; font-weight: 800; letter-spacing: 0.8px;
      background: linear-gradient(to right, #FFFFFF, #CBD5E1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .hero-header p { font-size: 13px; color: var(--text-secondary); max-width: 460px; margin: 0 auto 14px; }
    .quick-links { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .pill-link {
      background: rgba(255,255,255,0.06); color: #E2E8F0; text-decoration: none;
      font-size: 11px; font-weight: 600; padding: 6px 12px; border-radius: 8px;
      border: 1px solid var(--border-subtle); transition: 0.2s;
    }
    .pill-link:hover { background: rgba(255,255,255,0.12); border-color: var(--accent-blue); }

    /* Container & Pencarian Sticky */
    .container { max-width: 720px; margin: 0 auto; padding: 16px; }
    .sticky-controls {
      position: sticky; top: 0; z-index: 15;
      background: rgba(11, 17, 32, 0.88); backdrop-filter: blur(12px);
      padding: 12px 0 10px; margin: -12px 0 12px;
    }
    .search-wrapper { position: relative; margin-bottom: 10px; }
    .search-wrapper input {
      width: 100%; padding: 13px 16px 13px 42px; border-radius: 14px;
      background: var(--bg-card); border: 1px solid var(--border-subtle);
      color: var(--text-primary); font-size: 14px; outline: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25); transition: 0.2s;
    }
    .search-wrapper input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 15px; }

    /* Filter Tabs */
    .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-subtle);
      padding: 7px 14px; border-radius: 99px; font-size: 12px; font-weight: 600;
      white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #2563EB, #1D4ED8); color: white;
      border-color: transparent; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* Grid & Kartu Produk Premium */
    .grid-produk { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .card {
      background: var(--bg-card); border-radius: 16px; padding: 12px;
      border: 1px solid var(--border-subtle); display: flex; flex-direction: column;
      justify-content: space-between; transition: transform 0.2s, border-color 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .card:hover { transform: translateY(-2px); border-color: rgba(56, 189, 248, 0.35); background: var(--bg-card-hover); }
    .card.habis { opacity: 0.55; }
    .foto-box {
      width: 100%; height: 135px; background: linear-gradient(145deg, #1E293B, #0F172A);
      border-radius: 12px; margin-bottom: 10px; display: flex; align-items: center;
      justify-content: center; overflow: hidden; position: relative; border: 1px solid var(--border-subtle);
    }
    .foto-box img { width: 100%; height: 100%; object-fit: cover; }
    .foto-placeholder {
      width: 48px; height: 48px; border-radius: 12px; background: rgba(56, 189, 248, 0.1);
      color: var(--accent-blue); display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; letter-spacing: 1px;
    }
    .stok-pill {
      position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 99px; backdrop-filter: blur(6px);
    }
    .stok-ada { background: rgba(16, 185, 129, 0.2); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.35); }
    .stok-kosong { background: rgba(239, 68, 68, 0.25); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .nama-produk { font-weight: 700; font-size: 14px; color: var(--text-primary); margin-bottom: 3px; line-height: 1.35; }
    .varian { font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; }
    .harga { font-weight: 800; font-size: 16px; color: var(--accent-gold); margin-bottom: 10px; }
    
    .btn-tambah {
      background: linear-gradient(135deg, #10B981, #059669); color: white; border: none;
      padding: 10px; border-radius: 10px; font-weight: 700; font-size: 12px;
      cursor: pointer; width: 100%; letter-spacing: 0.3px; transition: 0.2s;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25);
    }
    .btn-tambah:disabled { background: #334155; color: #94A3B8; box-shadow: none; cursor: not-allowed; }
    .qty-control {
      display: flex; align-items: center; justify-content: space-between;
      background: #0F172A; border-radius: 10px; padding: 4px; border: 1px solid var(--accent-emerald);
    }
    .qty-control button {
      background: var(--accent-emerald); color: #0B1120; border: none; width: 28px; height: 28px;
      border-radius: 7px; font-weight: 800; font-size: 16px; cursor: pointer;
    }
    .qty-control span { font-weight: 800; font-size: 14px; color: var(--text-primary); }
    /* Floating Cart Bar */
    .cart-bar {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 688px;
      background: rgba(19, 28, 49, 0.95); backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px;
      padding: 12px 16px; display: none; justify-content: space-between; align-items: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5); z-index: 25;
    }
    .cart-bar.aktif { display: flex; }
    .cart-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; }
    .cart-total { font-size: 18px; font-weight: 800; color: #34D399; }
    .btn-wa {
      background: linear-gradient(135deg, #22C55E, #16A34A); color: white; border: none;
      padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 13px;
      cursor: pointer; box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
    }

    /* Modal Checkout */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 40; align-items: flex-end; justify-content: center; }
    .modal.buka { display: flex; }
    .modal-content {
      background: #131C31; width: 100%; max-width: 680px; border-radius: 24px 24px 0 0;
      padding: 22px; max-height: 88vh; overflow-y: auto; border-top: 1px solid var(--border-subtle);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-subtle); padding-bottom: 14px; margin-bottom: 14px; }
    .modal-header h3 { font-size: 17px; font-weight: 800; color: var(--text-primary); }
    .item-keranjang { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border-subtle); }
    .input-pelanggan {
      width: 100%; padding: 12px 14px; background: #0B1120; border: 1px solid var(--border-subtle);
      color: var(--text-primary); border-radius: 10px; margin-top: 6px; margin-bottom: 12px; font-size: 14px; outline: none;
    }
    .input-pelanggan:focus { border-color: var(--accent-blue); }
    .btn-kirim-wa {
      width: 100%; background: linear-gradient(135deg, #22C55E, #15803D); color: white; border: none;
      padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
    }
  </style>
</head>
<body>
  <header class="hero-header">
    <div class="badge-toko"><span class="dot-live"></span> Buka & Siap Melayani</div>
    <h1>KIOS DIAN</h1>
    <p>Jl. Tubagus Ismail Bawah No. 32, Lebak Gede • Belanja Harian Lengkap, Harga Bersahabat</p>
    <div class="quick-links">
      <a href="https://wa.me" target="_blank" class="pill-link">💬 Chat WhatsApp Toko</a>
      <a href="http://r.grab.com/o/f2m63Eny" target="_blank" class="pill-link">🛵 Pesan via GrabMart</a>
    </div>
  </header>

  <div class="container">
    <div class="sticky-controls">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="inputCari" placeholder="Cari kopi, obat, rokok, atau kebutuhan harian..." onkeyup="terapkanFilter()">
      </div>
      <div class="filter-tabs" id="filterTabs">
        <button class="tab-btn active" onclick="pilihKategori('semua', this)">Semua Produk</button>
        <button class="tab-btn" onclick="pilihKategori('tersedia', this)">Stok Tersedia</button>
        <button class="tab-btn" onclick="pilihKategori('minuman', this)">Kopi & Minuman</button>
        <button class="tab-btn" onclick="pilihKategori('obat', this)">Obat & Kesehatan</button>
        <button class="tab-btn" onclick="pilihKategori('rokok', this)">Rokok</button>
      </div>
    </div>

    <div id="daftarProduk" class="grid-produk">Memuat etalase Kios Dian...</div>
  </div>

  <div id="cartBar" class="cart-bar">
    <div>
      <div id="jumlahItem" class="cart-label">0 Barang dipilih</div>
      <div id="totalHarga" class="cart-total">Rp 0</div>
    </div>
    <button class="btn-wa" onclick="bukaModal()">Checkout WhatsApp →</button>
  </div>

  <div id="modalKeranjang" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🛍️ Ringkasan Pesanan Anda</h3>
        <button onclick="tutupModal()" style="background:none;border:none;color:#94A3B8;font-size:24px;cursor:pointer;">&times;</button>
      </div>
      <div id="listKeranjang"></div>
      <div style="margin-top:16px;">
        <label style="font-size:12px;font-weight:700;color:#94A3B8;">NAMA PEMESAN</label>
        <input type="text" id="namaPemesan" class="input-pelanggan" placeholder="Tulis nama Anda...">
        <label style="font-size:12px;font-weight:700;color:#94A3B8;">METODE AMBIL / ALAMAT ANTAR</label>
        <input type="text" id="catatanPesanan" class="input-pelanggan" placeholder="Contoh: Ambil sendiri ke kios / Antar ke alamat...">
      </div>
      <button class="btn-kirim-wa" onclick="kirimKeWhatsApp()">Kirim Pesanan ke WhatsApp Kios Dian</button>
    </div>
  </div>
  <script>
    const NOMOR_WA_TOKO = "6281395295203";
    let semuaProduk = [];
    let keranjang = {};
    let kategoriAktif = "semua";

    async function muatDataProduk() {
      try {
        const res = await fetch('produk.json?v=' + new Date().getTime());
        semuaProduk = await res.json();
        terapkanFilter();
      } catch (e) {
        document.getElementById('daftarProduk').innerHTML = "<p style='color:#94A3B8;'>Gagal memuat katalog produk.</p>";
      }
    }

    function formatRupiah(angka) {
      return "Rp " + angka.toLocaleString('id-ID');
    }

    function buatInisial(nama) {
      return nama.split(' ').slice(0, 2).map(k => k[0]).join('').toUpperCase();
    }

    function gantiKePngAtauInisial(imgElement, kode, inisial) {
      if (!imgElement.dataset.cobaPng) {
        imgElement.dataset.cobaPng = "1";
        imgElement.src = `foto/${kode}.png`;
      } else {
        imgElement.parentElement.innerHTML = `<div class="foto-placeholder">${inisial}</div>`;
      }
    }

    function pilihKategori(kat, tombol) {
      kategoriAktif = kat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      tombol.classList.add('active');
      terapkanFilter();
    }

    function cocokKategori(p) {
      const teks = (p.nama + " " + (p.varian || "")).toLowerCase();
      if (kategoriAktif === "semua") return true;
      if (kategoriAktif === "tersedia") return p.stok > 0;
      if (kategoriAktif === "minuman") return /good day|tea|kopi|coffee|extra joss|kuku bima|madurasa|vitacimin/.test(teks);
      if (kategoriAktif === "obat") return /panadol|mixagrip|diapet|neozep|konidin|antimo|oskadon|koyo|salonpas|bodrex|contrexyn|paramex|decolgen|tolak angin|entrostop|promag|antangin|esemag|kayu putih|obh|komix|hansaplas/.test(teks);
      if (kategoriAktif === "rokok") return /kretek|filter|mild|sampoerna|djarum|marlboro|camel|lucky|magnum|gg|surya|signature|dji sam soe|juara|jazy|la |neslite|ten mild|rival|orbit|drava|harmoni|sukun|djava|brown|janaka|loyal|asy|hs/.test(teks);
      return true;
    }

    function terapkanFilter() {
      const kata = document.getElementById('inputCari').value.toLowerCase();
      const hasil = semuaProduk.filter(p => {
        const cocokKata = p.nama.toLowerCase().includes(kata) || (p.varian && p.varian.toLowerCase().includes(kata));
        return cocokKata && cocokKategori(p);
      });
      tampilkanProduk(hasil);
    }

    function tampilkanProduk(data) {
      const wadah = document.getElementById('daftarProduk');
      if (data.length === 0) {
        wadah.innerHTML = "<p style='grid-column:1/-1;text-align:center;color:#94A3B8;padding:30px 0;'>Produk tidak ditemukan pada kategori ini.</p>";
        return;
      }
      wadah.innerHTML = data.map(p => {
        const qty = keranjang[p.kode] ? keranjang[p.kode].qty : 0;
        const habis = p.stok <= 0;
        const inisial = buatInisial(p.nama);
        return `
          <div class="card ${habis ? 'habis' : ''}">
            <div>
              <div class="foto-box">
                <span class="stok-pill ${habis ? 'stok-kosong' : 'stok-ada'}">
                  ${habis ? 'Habis' : 'Stok ' + p.stok}
                </span>
                <img src="foto/${p.kode}.jpg" alt="${p.nama}" onerror="gantiKePngAtauInisial(this, '${p.kode}', '${inisial}')">
              </div>
              <div class="nama-produk">${p.nama}</div>
              <div class="varian">${p.varian || 'Reguler'}</div>
            </div>
            <div>
              <div class="harga">${formatRupiah(p.harga)}</div>
              ${habis ? `<button class="btn-tambah" disabled>Stok Kosong</button>` :
                qty === 0 ? `<button class="btn-tambah" onclick="ubahQty('${p.kode}', 1)">+ Keranjang</button>` :
                `<div class="qty-control">
                  <button onclick="ubahQty('${p.kode}', -1)">−</button>
                  <span>${qty}</span>
                  <button onclick="ubahQty('${p.kode}', 1)">+</button>
                </div>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function ubahQty(kode, delta) {
      const produk = semuaProduk.find(p => p.kode === kode);
      if (!produk) return;
      const qtySekarang = keranjang[kode] ? keranjang[kode].qty : 0;
      const qtyBaru = qtySekarang + delta;
      if (qtyBaru > produk.stok) {
        alert("Maaf, stok barang ini hanya tersisa " + produk.stok);
        return;
      }
      if (qtyBaru <= 0) {
        delete keranjang[kode];
      } else {
        keranjang[kode] = { ...produk, qty: qtyBaru };
      }
      terapkanFilter();
      perbaruiBarKeranjang();
    }

    function perbaruiBarKeranjang() {
      const daftar = Object.values(keranjang);
      const totalItem = daftar.reduce((sum, item) => sum + item.qty, 0);
      const totalHarga = daftar.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const bar = document.getElementById('cartBar');
      if (totalItem > 0) {
        bar.classList.add('aktif');
        document.getElementById('jumlahItem').innerText = totalItem + " Item di Keranjang";
        document.getElementById('totalHarga').innerText = formatRupiah(totalHarga);
      } else {
        bar.classList.remove('aktif');
        tutupModal();
      }
    }

    function bukaModal() {
      const daftar = Object.values(keranjang);
      let total = 0;
      document.getElementById('listKeranjang').innerHTML = daftar.map(item => {
        const sub = item.harga * item.qty;
        total += sub;
        return `
          <div class="item-keranjang">
            <div>
              <div style="font-weight:700;font-size:14px;color:#F8FAFC;">${item.nama}</div>
              <div style="font-size:12px;color:#94A3B8;">${item.qty} x ${formatRupiah(item.harga)}</div>
            </div>
            <div style="font-weight:800;color:#F59E0B;">${formatRupiah(sub)}</div>
          </div>
        `;
      }).join('') + `<div style="display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.1);"><span style="color:#94A3B8;font-size:13px;">TOTAL BELANJA</span><span style="color:#34D399;">${formatRupiah(total)}</span></div>`;
      document.getElementById('modalKeranjang').classList.add('buka');
    }

    function tutupModal() {
      document.getElementById('modalKeranjang').classList.remove('buka');
    }

    function kirimKeWhatsApp() {
      const nama = document.getElementById('namaPemesan').value.trim() || "Pelanggan";
      const catatan = document.getElementById('catatanPesanan').value.trim();
      const daftar = Object.values(keranjang);
      if (daftar.length === 0) return;

      let total = 0;
      let teks = `Halo *KIOS DIAN*, saya mau pesan barang berikut:\n\n`;
      teks += `*Nama:* ${nama}\n`;
      if (catatan) teks += `*Info:* ${catatan}\n`;
      teks += `------------------------------\n`;

      daftar.forEach((item, idx) => {
        const sub = item.harga * item.qty;
        total += sub;
        teks += `${idx + 1}. ${item.nama} (${item.qty}x) = ${formatRupiah(sub)}\n`;
      });

      teks += `------------------------------\n`;
      teks += `*TOTAL PESANAN: ${formatRupiah(total)}*\n\nMohon info ketersediaannya ya. Terima kasih!`;

      const url = `https://wa.me{NOMOR_WA_TOKO}?text=${encodeURIComponent(teks)}`;
      window.open(url, '_blank');
    }

    muatDataProduk();
  </script>
</body>
</html>
